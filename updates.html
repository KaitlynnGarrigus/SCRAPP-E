<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Updates | SCRAPP-E</title>
<meta name="description" content="Project updates from the SCRAPP-E team, written by the people building it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
.bar{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin-bottom:2rem}.bar label{font-weight:700}
.bar select{padding:.45rem .9rem;border:2px solid var(--ink);border-radius:99px;background:#fff;font-weight:600}
.post{background:#fff;border:1px solid var(--line);border-radius:18px;padding:1.6rem;margin-bottom:1.5rem}
.who{display:flex;align-items:center;gap:.9rem;margin-bottom:1rem}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 1.1rem var(--h);flex:none}
.who b{display:block;line-height:1.3}.who span{color:var(--muted);font-size:.92rem;line-height:1.3;display:block}
.post h3{margin-bottom:.7rem}.post p{margin-bottom:.8rem}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.8rem;margin-top:1rem}
.ph button{border:0;padding:0;background:none;text-align:left}.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px}
.ph span{display:block;font-size:.88rem;color:var(--muted);margin-top:.3rem}
.empty{color:var(--muted)}
</style>
</head>
<body>
<nav><div class="w"><strong>SCRAPP-E</strong>
<a href="index.html">Home</a><a href="updates.html" aria-current="page">Updates</a><a href="index.html#build">The build</a><a href="index.html#gallery">Gallery</a><a href="team.html">Team</a></div></nav>

<header class="hero"><div class="w">
  <h1>Project updates</h1>
  <p>What we are building, testing, and learning, written by the people doing the work.</p>
</div></header>

<main><div class="w">
  <div class="bar"><label for="who">Show posts by</label><select id="who"></select></div>
  <div id="feed" aria-live="polite"><p class="empty">Loading updates...</p></div>
</div></main>

<footer><div class="w">SCRAPP-E, a UNT Robotics project. <a href="index.html">Back to the main page</a> | <a href="admin.html">Team login</a></div></footer>
<dialog id="dlg"><button class="btn" id="dx" style="float:right">Close</button><img id="dimg" alt=""><p id="dcap"></p></dialog>

<script type="module">
import {members} from './members.js';
import {firebaseConfig as cfg} from './firebase-config.js';
const $=s=>document.querySelector(s);
// Earlier updates from before the team page existed (shown below new posts). Edit freely.
const earlier=[
 {author:'SCRAPP-E team',date:'2026-10-12',title:'$2,500 in funding secured',body:'The project is funded. The money covers upgraded motors and drivers, LCD screens, obstacle sensors, battery and power parts, and hardware and filament.'},
 {author:'SCRAPP-E team',date:'2026-09-21',title:'Requirements and traceability matrix completed',body:'We finished our Development of Requirements document and a traceability matrix, linking every requirement to a design spec, a test, and a clear pass/fail rule.'},
 {author:'SCRAPP-E team',date:'2026-09-19',title:'Stakeholder interviews',body:'We interviewed people in sales, finance, manufacturing engineering, robotics, and healthcare, plus end users. Their message: keep it affordable, reliable, and flexible in how it communicates.'}
];
let posts=[],note='';
const colors=['#00853E','#2F6F9F','#6B8F23','#7A5C99','#B7790A','#2A7F7F','#A04A4A','#4A5B8C'];

if(!cfg.apiKey.startsWith('PASTE')){
  try{
    const {initializeApp}=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const {getFirestore,collection,getDocs,query,orderBy}=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    const db=getFirestore(initializeApp(cfg));
    const snap=await getDocs(query(collection(db,'posts'),orderBy('date','desc')));
    posts=snap.docs.map(d=>d.data());
  }catch(e){note='New posts could not be loaded right now. Showing earlier updates.'}
}else note='Team posts will appear here once the database is connected.';

const names=[...new Set([...posts,...earlier].map(p=>p.author))];
$('#who').innerHTML='<option value="">Everyone</option>'+names.map(n=>`<option>${n}</option>`).join('');
$('#who').onchange=render;

const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function render(){
  const f=$('#who').value,feed=$('#feed');feed.innerHTML='';
  if(note)feed.append(el('p','note',note));
  const list=[...posts,...earlier].filter(p=>!f||p.author===f);
  if(!list.length)feed.append(el('p','empty','No posts yet.'));
  list.forEach(p=>{
    const m=members.findIndex(x=>x.n===p.author),role=members[m]?.r||'Team update';
    const c=el('article','post'),who=el('div','who'),av=el('div','av',p.author.replace('Dr. ','').split(' ').map(w=>w[0]).slice(0,2).join(''));
    av.style.background=colors[(m<0?3:m)%colors.length];av.setAttribute('aria-hidden','true');
    const t=el('div');t.append(el('b','',p.author));
    t.append(el('span','',role+' | '+new Date(p.date+'T12:00:00').toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})));
    who.append(av,t);c.append(who,el('h3','',p.title));
    (p.body||'').split(/\n+/).filter(Boolean).forEach(s=>c.append(el('p','',s)));
    if(p.photos?.length){const g=el('div','ph');p.photos.forEach(ph=>{
      const b=el('button'),i=el('img');i.src=ph.s;i.alt=ph.c||'Photo from '+p.title;i.loading='lazy';b.append(i);if(ph.c)b.append(el('span','',ph.c));
      b.onclick=()=>{$('#dimg').src=ph.s;$('#dimg').alt=i.alt;$('#dcap').textContent=ph.c||'';$('#dlg').showModal()};g.append(b)});c.append(g)}
    feed.append(c)});
}
$('#dx').onclick=()=>$('#dlg').close();$('#dlg').onclick=e=>{if(e.target.id==='dlg')$('#dlg').close()};
render();
</script>
</body>
</html>
