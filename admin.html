<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Team login | SCRAPP-E</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:1.8rem;max-width:620px}
label{display:block;font-weight:700;margin:1.1rem 0 .3rem}
input[type=text],input[type=password],input[type=date],select,textarea{width:100%;padding:.65rem .9rem;border:2px solid var(--line);border-radius:12px;background:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--unt);outline:none}textarea{min-height:170px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.prev{display:grid;gap:.8rem;margin-top:.8rem}.pv{display:flex;gap:.8rem;align-items:center;background:var(--paper);border-radius:12px;padding:.6rem}
.pv img{width:84px;height:64px;object-fit:cover;border-radius:8px}.pv input{flex:1;padding:.4rem .7rem}
.top{display:flex;justify-content:space-between;align-items:center;max-width:620px;margin-bottom:1rem}
.mine{max-width:620px;margin-top:2.5rem}.mine li{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--line)}
.mine ul{list-style:none;padding:0;margin:1rem 0 0}.mine small{color:var(--muted);display:block}
[hidden]{display:none!important}
@media(max-width:600px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav><div class="w"><strong>SCRAPP-E</strong><a href="index.html">Home</a><a href="updates.html">Updates</a><a href="team.html">Team</a><a href="admin.html" aria-current="page">Team login</a></div></nav>
<header class="hero"><div class="w"><h1>Team login</h1><p>Sign in to post a project update.</p></div></header>

<main><div class="w">
  <p class="note" id="setup" hidden>The database is not connected yet. Finish the setup steps, then this login will work.</p>

  <form class="card" id="login" autocomplete="on">
    <h2>Sign in</h2>
    <label for="u">Username or email</label><input type="text" id="u" autocomplete="username" required>
    <label for="p">Password</label><input type="password" id="p" autocomplete="current-password" required>
    <p class="msg" id="lmsg" role="alert"></p>
    <button class="btn" id="lbtn">Sign in</button>
  </form>

  <div id="panel" hidden>
    <div class="top"><h2>New update</h2><button class="btn ghost" id="out">Sign out</button></div>
    <form class="card" id="post">
      <label for="a">Who is writing?</label>
      <select id="a" required><option value="" disabled selected>Choose a team member</option></select>
      <label for="t">Title</label><input type="text" id="t" maxlength="120" required>
      <div class="row"><div><label for="d">Date</label><input type="date" id="d" required></div><div></div></div>
      <label for="b">What happened?</label><textarea id="b" required></textarea>
      <label for="f">Photos (up to 4)</label><input type="file" id="f" accept="image/*" multiple>
      <div class="prev" id="prev"></div>
      <p class="msg" id="pmsg" role="alert"></p>
      <button class="btn" id="pbtn">Publish update</button>
    </form>
    <div class="mine"><h2>Published posts</h2><ul id="list"></ul></div>
  </div>
</div></main>

<footer><div class="w">SCRAPP-E, a UNT Robotics project. <a href="index.html">Back to the main page</a></div></footer>

<script type="module">
import {members} from './members.js';
import {firebaseConfig as cfg} from './firebase-config.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,collection,addDoc,getDocs,deleteDoc,doc,query,orderBy,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const $=s=>document.querySelector(s);
const DOMAIN='@scrappe-admin.example'; // a plain username (no @) is turned into this email; a full email is used as typed
$('#a').innerHTML+=members.map(m=>`<option value="${m.n}">${m.n}, ${m.r}</option>`).join('');
$('#d').valueAsDate=new Date();

if(cfg.apiKey.startsWith('PASTE')){$('#setup').hidden=false;$('#lbtn').disabled=true}
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);

$('#login').onsubmit=async e=>{e.preventDefault();$('#lmsg').textContent='';$('#lmsg').className='msg';
  try{const id=$('#u').value.trim().toLowerCase();await signInWithEmailAndPassword(auth,id.includes('@')?id:id+DOMAIN,$('#p').value)}
  catch(err){$('#lmsg').textContent='Wrong username or password.';$('#lmsg').className='msg err'}};
$('#out').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{$('#login').hidden=!!u;$('#panel').hidden=!u;if(u){$('#p').value='';loadList()}});

// Photos: shrunk in the browser so they fit in the database
let items=[];
async function enc(file,max,q){const b=await createImageBitmap(file),r=Math.min(1,max/Math.max(b.width,b.height)),c=document.createElement('canvas');
  c.width=Math.round(b.width*r);c.height=Math.round(b.height*r);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
async function encodeAll(){for(const [m,q] of [[1000,.75],[800,.65],[640,.55]]){
  const out=[];for(const it of items)out.push(await enc(it.file,m,q));
  if(out.reduce((a,s)=>a+s.length,0)<820000)return out}throw new Error('size')}
function drawPrev(){const p=$('#prev');p.innerHTML='';items.forEach((it,i)=>{const d=document.createElement('div');d.className='pv';
  const im=document.createElement('img');im.src=URL.createObjectURL(it.file);im.alt='';
  const c=document.createElement('input');c.type='text';c.placeholder='Caption (optional)';c.value=it.cap;c.maxLength=140;c.setAttribute('aria-label','Caption for photo '+(i+1));c.oninput=()=>it.cap=c.value;
  const x=document.createElement('button');x.type='button';x.className='btn del';x.textContent='Remove';x.onclick=()=>{items.splice(i,1);drawPrev()};
  d.append(im,c,x);p.append(d)})}
$('#f').onchange=e=>{for(const f of e.target.files){if(items.length<4)items.push({file:f,cap:''})}e.target.value='';drawPrev()};

const say=(t,ok)=>{$('#pmsg').textContent=t;$('#pmsg').className='msg '+(ok?'ok':'err')};
$('#post').onsubmit=async e=>{e.preventDefault();$('#pbtn').disabled=true;say('Publishing...',true);
  try{
    let photos=[];
    if(items.length){const urls=await encodeAll();photos=urls.map((s,i)=>({s,c:items[i].cap.trim()}))}
    await addDoc(collection(db,'posts'),{author:$('#a').value,title:$('#t').value.trim(),date:$('#d').value,body:$('#b').value.trim(),photos,created:serverTimestamp()});
    $('#post').reset();$('#d').valueAsDate=new Date();items=[];drawPrev();say('Published! It is now on the Updates page.',true);loadList();
  }catch(err){say(err.message==='size'?'Those photos are too large. Try fewer or smaller photos.':'Could not publish. Check your connection and that you are signed in. Photos from some phones (HEIC) are not supported; use JPG or PNG.',false)}
  $('#pbtn').disabled=false};

async function loadList(){const ul=$('#list');ul.innerHTML='';
  try{const s=await getDocs(query(collection(db,'posts'),orderBy('date','desc')));
    if(s.empty)ul.innerHTML='<li>No posts yet.</li>';
    s.forEach(d=>{const p=d.data(),li=document.createElement('li'),t=document.createElement('div');
      t.innerHTML='<b></b><small></small>';t.firstChild.textContent=p.title;t.lastChild.textContent=p.author+' | '+p.date+(p.photos?.length?' | '+p.photos.length+' photo(s)':'');
      const b=document.createElement('button');b.className='btn del';b.textContent='Delete';
      b.onclick=async()=>{if(confirm('Delete "'+p.title+'"? This cannot be undone.')){await deleteDoc(doc(db,'posts',d.id));loadList()}};
      li.append(t,b);ul.append(li)})}catch(e){ul.innerHTML='<li>Could not load posts.</li>'}}
</script>
</body>
</html>
